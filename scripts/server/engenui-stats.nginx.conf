# Page statistics of the test site (pilot only; scripts/server/setup-stats.sh installs it, remove-stats.sh removes it).
# The ping is logged WITHOUT the visitor's address (its own log format) and answers 204.
location = /test/ping {
    access_log /var/log/engenui/ping.log engenui_ping;
    add_header Cache-Control "no-store";
    return 204;
}
location = /test/stats.json {
    alias /var/lib/engenui-stats/stats.json;
    default_type application/json;
    add_header Cache-Control "no-store";
}
location = /test/pagestats { return 302 /test/#/pagestats; }
